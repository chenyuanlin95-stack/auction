<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>对象拍卖会</title><link rel="stylesheet" href="styles.css"><meta name="auction-build" content="sealed-second-price-v1"></head>
<body><div class="wrap">
<h1>对象拍卖会</h1><div class="small">匿名报价 · 最高报价者获得对象 · 按第二高报价成交。</div>
<div id="join" class="card">
 <div style="font-weight:900;font-size:20px">加入拍卖</div>
 <div class="row stack" style="margin-top:12px"><input id="room" maxlength="8" placeholder="房间码"><input id="name" maxlength="20" placeholder="你的昵称"><button class="primary" id="joinBtn">加入</button></div>
 <div id="joinMsg" class="msg"></div>
</div>
<div id="main" class="hidden">
 <div class="grid">
  <div class="stat"><div class="lab">我</div><div class="val" id="me"></div></div>
  <div class="stat"><div class="lab">我的资产</div><div class="val" id="balance"></div></div>
  <div class="stat wide"><div class="lab">房间</div><div class="val" id="roomCode"></div><button id="leaveBtn" style="margin-top:8px">退出 / 切换房间</button></div>
 </div>
 <div class="card">
  <div class="small" id="lotNo">等待主持人放出对象</div><div class="title" id="title">还没开拍</div><div class="desc" id="desc" style="white-space:pre-line">主持人开始后，这里会自动出现当前对象。</div>
  <div class="row" style="margin-top:15px"><div><div class="lab">最低报价</div><b id="start">—</b></div><div><div class="lab">规则</div><b>最高者得 · 第二价支付</b></div></div>
  <div class="high">
    <div class="lab" style="color:#bbb">我的本轮报价</div>
    <div class="price" id="myBid">—</div>
    <div id="roundStatus">等待开拍</div>
  </div>
 </div>
 <div class="card">
  <div style="font-weight:900">匿名报价</div>
  <div class="small" style="margin-top:5px">其他玩家看不到你的报价；开拍期间可以修改。单位：万。</div>
  <div class="row stack" style="margin-top:10px"><input id="bid" type="number" inputmode="numeric" step="100" min="100" placeholder="输入金额（万），如 500"><button class="primary" id="bidBtn">提交匿名报价</button></div>
  <div class="msg" id="msg"></div>
 </div>
 <div class="card"><div style="font-weight:900">我的藏品</div><div id="owned" class="small" style="margin-top:8px">暂无</div></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="love-lots.js"></script><script src="love-shared.js"></script>
<script>
let sb=null,roomId=null,token=null,playerId=null,player=null,roomData=null,wins=[],myBid=null,currentResult=null,pollTimer=null,channel=null;
let syncGeneration=0;
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);$('room').value=(q.get('room')||'').toUpperCase();
function stopSync(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}if(channel&&sb){try{sb.removeChannel(channel)}catch(e){}channel=null}syncGeneration++}
function clearPlayerState(){playerId=null;player=null;roomData=null;wins=[];myBid=null;currentResult=null;$('me').textContent='';$('balance').textContent='';$('roomCode').textContent='';$('lotNo').textContent='等待主持人放出对象';$('title').textContent='还没开拍';$('desc').textContent='主持人开始后，这里会自动出现当前对象。';$('start').textContent='—';$('myBid').textContent='—';$('roundStatus').textContent='等待开拍';$('bid').value='';$('bidBtn').disabled=true;$('owned').innerHTML='暂无';$('msg').textContent=''}
function renderOwned(){$('owned').innerHTML=wins.length?wins.map(w=>{const l=LOTS.find(x=>x.id===Number(w.lot_id));return `<div class="owned"><b>${l?l.title:'LOT '+w.lot_id}</b><div class="small">成交价 ${fmtWan(w.price)}</div></div>`}).join(''):'暂无'}
function render(){
 if(player){$('me').textContent=player.name;$('balance').textContent=fmt(player.balance)}
 renderOwned();
 if(!roomData||!roomData.current_lot){
   $('lotNo').textContent='等待主持人放出对象';$('title').textContent='还没开拍';$('desc').textContent='主持人开始后，这里会自动出现当前对象。';$('start').textContent='—';$('myBid').textContent='—';$('roundStatus').textContent='等待开拍';$('bidBtn').disabled=true;return;
 }
 const L=LOTS.find(x=>x.id===Number(roomData.current_lot));if(!L)return;
 $('lotNo').textContent='LOT '+String(L.id).padStart(2,'0')+(roomData.status==='open'?' · 匿名报价中':' · 已揭晓');
 $('title').textContent=L.title;$('desc').textContent=L.desc;$('start').textContent=fmtWan(1000000);
 $('myBid').textContent=myBid?fmtWan(myBid):'尚未报价';
 if(roomData.status==='open'){
   $('roundStatus').textContent=myBid?'已提交，可在揭晓前修改':'其他人的报价不可见';
   $('bidBtn').disabled=false;
   $('bidBtn').textContent=myBid?'修改匿名报价':'提交匿名报价';
 }else{
   $('bidBtn').disabled=true;
   if(currentResult&&currentResult.player_name){
     const won=currentResult.player_id===playerId;
     $('roundStatus').textContent=won?`🎉 你拍到了！成交价 ${fmtWan(currentResult.price)}`:`成交：${currentResult.player_name} · ${fmtWan(currentResult.price)}`;
   }else $('roundStatus').textContent='本轮已结束';
 }
}
async function refresh(){
 if(!sb||!roomId||!token)return;const gen=syncGeneration,rid=roomId,tok=token;
 try{
  const {data,error}=await sb.rpc('love_get_player_state',{p_room_id:rid,p_player_token:tok});
  if(gen!==syncGeneration||rid!==roomId||tok!==token)return;if(error)throw error;if(!data||!data.room||!data.player)throw new Error('没有读到玩家状态');
  roomData=data.room;player=data.player;playerId=player.id;wins=Array.isArray(data.wins)?data.wins:[];myBid=data.my_bid==null?null:Number(data.my_bid);currentResult=data.current_result||null;
  render();if(($('msg').textContent||'').startsWith('同步失败'))$('msg').textContent='';
 }catch(e){if(gen===syncGeneration&&rid===roomId){console.error('refresh failed',e);$('msg').textContent='同步失败：'+e.message}}
}
function startSync(){
 stopSync();const gen=syncGeneration,rid=roomId;
 pollTimer=setInterval(()=>{if(gen===syncGeneration&&rid===roomId)refresh()},1000);
 channel=sb.channel('love-play-'+rid+'-'+Date.now())
  .on('postgres_changes',{event:'*',schema:'public',table:'love_rooms',filter:'id=eq.'+rid},refresh)
  .on('postgres_changes',{event:'*',schema:'public',table:'love_players',filter:'room_id=eq.'+rid},refresh)
  .on('postgres_changes',{event:'*',schema:'public',table:'love_wins',filter:'room_id=eq.'+rid},refresh)
  .on('postgres_changes',{event:'*',schema:'public',table:'love_bids',filter:'room_id=eq.'+rid},refresh)
  .subscribe();
}
function enterMain(){$('join').classList.add('hidden');$('main').classList.remove('hidden');$('roomCode').textContent=roomId;if(player){$('me').textContent=player.name;$('balance').textContent=fmt(player.balance)}startSync();refresh()}
async function join(){try{stopSync();clearPlayerState();sb=makeClient();const rid=$('room').value.trim().toUpperCase();const name=$('name').value.trim();if(!rid||!name)throw new Error('请输入房间码和昵称');const tok=localStorage.getItem('love_auction_token_'+rid)||randToken();localStorage.setItem('love_auction_token_'+rid,tok);const {data,error}=await sb.rpc('love_join_room',{p_room_id:rid,p_name:name,p_token:tok});if(error)throw error;if(!data||!data.length)throw new Error('加入失败：服务器没有返回玩家信息');roomId=rid;token=tok;playerId=data[0].player_id;player={id:playerId,name,balance:Number(data[0].balance)};$('joinMsg').textContent='';enterMain()}catch(e){roomId=null;token=null;$('joinMsg').textContent=e.message}}
async function leaveRoom(){const rid=roomId,tok=token;stopSync();try{if(sb&&rid&&tok)await sb.rpc('love_leave_room',{p_room_id:rid,p_player_token:tok})}catch(e){console.warn('leave failed',e)}roomId=null;token=null;clearPlayerState();$('main').classList.add('hidden');$('join').classList.remove('hidden');$('room').value='';$('joinMsg').textContent=rid?'已退出房间 '+rid+'。可以输入新房间码，或重新输入这个房间码返回。':'请选择房间。'}
$('joinBtn').onclick=join;$('leaveBtn').onclick=leaveRoom;
async function submitBid(){
 try{
   const wan=Math.floor(Number($('bid').value));if(!wan)throw new Error('请输入报价（单位：万）');
   const amount=wan*10000;
   const {error}=await sb.rpc('love_place_bid',{p_room_id:roomId,p_player_token:token,p_amount:amount});if(error)throw error;
   $('msg').textContent='匿名报价已提交 · '+fmtWan(amount);$('msg').className='msg ok';$('bid').value='';await refresh();
 }catch(e){$('msg').textContent=e.message;$('msg').className='msg'}
}
$('bidBtn').onclick=submitBid;$('bid').addEventListener('keydown',e=>{if(e.key==='Enter')submitBid()});
window.addEventListener('pageshow',()=>{if(!$('main').classList.contains('hidden'))return;stopSync();roomId=null;token=null;clearPlayerState()});
if(!cfgOk())$('joinMsg').textContent='这个网页还没配置数据库，请先让主持人完成数据库设置。';
</script></body></html>
