<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>人生拍卖会</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="wrap">
<h1>人生拍卖会</h1><div class="small">玩家端 · 看拍品、看自己的钱、出价。</div>
<div id="join" class="card">
 <div style="font-weight:900;font-size:20px">加入拍卖</div>
 <div class="row stack" style="margin-top:12px"><input id="room" maxlength="8" placeholder="房间码"><input id="name" maxlength="20" placeholder="你的昵称"><button class="primary" id="joinBtn">加入</button></div>
 <div id="joinMsg" class="msg"></div>
</div>
<div id="main" class="hidden">
 <div class="grid">
  <div class="stat"><div class="lab">我</div><div class="val" id="me"></div></div>
  <div class="stat"><div class="lab">我的资产</div><div class="val" id="balance"></div></div>
  <div class="stat wide"><div class="lab">房间</div><div class="val" id="roomCode"></div></div>
 </div>
 <div class="card">
  <div class="small" id="lotNo">等待主持人放出拍品</div><div class="title" id="title">还没开拍</div><div class="desc" id="desc">主持人开始后，这里会自动出现当前拍品。</div>
  <div class="row" style="margin-top:15px"><div><div class="lab">起拍价</div><b id="start">—</b></div><div><div class="lab">最低加价</div><b id="step">—</b></div></div>
  <div class="high"><div class="lab" style="color:#bbb">当前最高价</div><div class="price" id="highest">—</div><div id="leader">等待开拍</div></div>
 </div>
 <div class="card">
  <div style="font-weight:900">我的出价</div>
  <div class="row stack" style="margin-top:10px"><input id="bid" type="number" inputmode="numeric" step="100000" placeholder="输入人民币金额"><button id="minBtn">最低有效价</button><button class="primary" id="bidBtn">确认出价</button></div>
  <div class="msg" id="msg"></div>
 </div>
 <div class="card"><div style="font-weight:900">我的藏品</div><div id="owned" class="small" style="margin-top:8px">暂无</div></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="lots.js"></script><script src="shared.js"></script>
<script>
let sb,roomId,token,playerId,player=null,roomData=null,wins=[];
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);$('room').value=(q.get('room')||'').toUpperCase();
function minValid(){if(!roomData||!roomData.current_lot)return 0;const L=LOTS.find(x=>x.id===roomData.current_lot);return roomData.current_bid?roomData.current_bid+L.step:L.start}
function render(){
 if(player){$('me').textContent=player.name;$('balance').textContent=fmt(player.balance)}
 if(!roomData||!roomData.current_lot){$('title').textContent='还没开拍';$('desc').textContent='主持人开始后，这里会自动出现当前拍品。';$('bidBtn').disabled=true;return}
 const L=LOTS.find(x=>x.id===roomData.current_lot);$('lotNo').textContent='LOT '+String(L.id).padStart(2,'0')+(roomData.status==='open'?' · 竞拍中':' · 已结束');$('title').textContent=L.title;$('desc').textContent=L.desc;$('start').textContent=fmt(L.start);$('step').textContent='≥ '+fmt(L.step);
 $('highest').textContent=roomData.current_bid?fmt(roomData.current_bid):'尚无人出价';$('leader').textContent=roomData.current_bidder_name?'当前领先：'+roomData.current_bidder_name:(roomData.status==='open'?'等待第一位竞拍者':'等待下一件');
 $('bid').placeholder='最低 '+fmt(minValid());$('bidBtn').disabled=roomData.status!=='open';$('minBtn').disabled=roomData.status!=='open';
 $('owned').innerHTML=wins.length?wins.map(w=>{const l=LOTS.find(x=>x.id===w.lot_id);return `<div class="owned"><b>${l?l.title:'LOT '+w.lot_id}</b><div class="small">成交价 ${fmt(w.price)}</div></div>`}).join(''):'暂无';
}
async function refresh(){
 let r=await sb.from('rooms').select('*').eq('id',roomId).single();if(r.data)roomData=r.data;
 let p=await sb.from('players').select('id,name,balance').eq('id',playerId).single();if(p.data)player=p.data;
 let w=await sb.from('wins').select('*').eq('player_id',playerId).order('created_at',{ascending:false});wins=w.data||[];render();
}
async function join(){
 try{
  sb=makeClient();roomId=$('room').value.trim().toUpperCase();const name=$('name').value.trim();if(!roomId||!name)throw new Error('请输入房间码和昵称');
  token=localStorage.getItem('auction_token_'+roomId)||randToken();localStorage.setItem('auction_token_'+roomId,token);
  const {data,error}=await sb.rpc('join_room',{p_room_id:roomId,p_name:name,p_token:token});if(error)throw error;
  playerId=data[0].player_id;$('join').classList.add('hidden');$('main').classList.remove('hidden');$('roomCode').textContent=roomId;
  sb.channel('play-'+roomId+'-'+playerId).on('postgres_changes',{event:'*',schema:'public',table:'rooms',filter:'id=eq.'+roomId},refresh).on('postgres_changes',{event:'UPDATE',schema:'public',table:'players',filter:'id=eq.'+playerId},refresh).on('postgres_changes',{event:'INSERT',schema:'public',table:'wins',filter:'player_id=eq.'+playerId},refresh).subscribe();
  await refresh();
 }catch(e){$('joinMsg').textContent=e.message}
}
$('joinBtn').onclick=join;
async function bid(amount){
 try{amount=Math.floor(Number(amount));if(!amount)throw new Error('请输入出价');const {error}=await sb.rpc('place_bid',{p_room_id:roomId,p_player_token:token,p_amount:amount});if(error)throw error;$('msg').textContent='出价成功 · '+fmt(amount);$('msg').className='msg ok';$('bid').value='';await refresh()}catch(e){$('msg').textContent=e.message;$('msg').className='msg'}
}
$('bidBtn').onclick=()=>bid($('bid').value);$('minBtn').onclick=()=>bid(minValid());$('bid').addEventListener('keydown',e=>{if(e.key==='Enter')$('bidBtn').click()});
if(!cfgOk())$('joinMsg').textContent='这个网页还没配置数据库，请先让主持人完成 README 中的设置。';
</script></body></html>
