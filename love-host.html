<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对象拍卖会 · 主持人</title><link rel="stylesheet" href="styles.css"><meta name="auction-build" content="sealed-second-price-v1"></head>
<body><div class="wrap">
<h1>对象拍卖会 · 主持人</h1><div class="small">匿名报价 · 最高报价者获得对象 · 按第二高报价成交。</div>
<div id="setup" class="card">
  <div style="font-weight:900;font-size:20px">进入拍卖房间</div>
  <div class="small" style="margin-top:6px">创建新房间，或输入以前的房间码重新进入。</div>
  <div class="row" style="margin-top:12px"><input id="roomInput" maxlength="8" placeholder="房间码（新建可留空）"><button class="primary" id="createBtn">创建新房间</button><button id="enterBtn">进入旧房间</button></div>
  <div id="setupMsg" class="msg"></div>
</div>
<div id="main" class="hidden">
  <div class="grid">
    <div class="stat"><div class="lab">房间码</div><div class="val roomcode" id="roomCode"></div><button id="leaveBtn" style="margin-top:8px">退出 / 切换房间</button></div>
    <div class="stat"><div class="lab">玩家数</div><div class="val" id="playerCount">0</div></div>
    <div class="stat wide"><div class="lab">加入链接</div><div class="val" style="font-size:13px;word-break:break-all" id="joinUrl"></div></div>
  </div>
  <div class="card"><div class="row">
    <div id="qr" class="qr"></div>
    <div><div style="font-weight:900">让大家扫码加入</div><div class="small">玩家之间看不到彼此报价。每轮揭晓后才公布报价结果。</div></div>
  </div></div>
  <div class="card">
    <div class="row"><select id="lotSelect" style="flex:1"></select><button class="primary" id="startBtn">放出这位对象</button></div>
    <div class="title" id="lotTitle">等待选择对象</div><div class="desc" id="lotDesc" style="white-space:pre-line"></div>
    <div class="high">
      <div class="lab" style="color:#bbb">匿名报价状态</div>
      <div class="price" id="bidCount">—</div>
      <div id="resultLine">等待开拍</div>
    </div>
    <div id="roundBids" class="small" style="margin-top:12px"></div>
    <div class="row" style="margin-top:12px"><button class="dark" id="hammer">🔨 揭晓并成交</button><button id="pass">流拍</button><button id="next">下一位</button></div>
    <div id="hostMsg" class="msg"></div>
  </div>
  <div class="card"><div style="font-weight:900">玩家资产</div><div id="players"></div></div>
  <div class="card"><div style="font-weight:900">已成交</div><div id="wins" class="small" style="margin-top:8px">暂无</div></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="config.js"></script><script src="love-lots.js"></script><script src="love-shared.js"></script>
<script>
let sb=null,roomId=null,hostSecret=null,roomData=null,players=[],wins=[],roundBids=[],bidCount=0,pollTimer=null,channel=null,browsingLot=false;
let syncGeneration=0;
const $=id=>document.getElementById(id);
LOTS.forEach(L=>{const o=document.createElement('option');o.value=L.id;o.textContent=String(L.id).padStart(2,'0')+' · '+L.title;$('lotSelect').appendChild(o)});
function currentLot(){return LOTS.find(x=>x.id===Number($('lotSelect').value))}
function stopSync(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}if(channel&&sb){try{sb.removeChannel(channel)}catch(e){}channel=null}syncGeneration++}
function clearRoomState(){
 roomData=null;players=[];wins=[];roundBids=[];bidCount=0;browsingLot=false;
 $('playerCount').textContent='0';$('players').innerHTML='<div class="small">等待玩家加入</div>';$('wins').innerHTML='暂无';
 $('lotTitle').textContent='等待选择对象';$('lotDesc').textContent='';$('bidCount').textContent='—';$('resultLine').textContent='等待开拍';$('roundBids').innerHTML='';$('hammer').disabled=true;$('hostMsg').textContent='';
}
function renderRoom(){
 if(!roomData)return;
 if(browsingLot){
  const L=currentLot(); if(L){$('lotTitle').textContent=L.title;$('lotDesc').textContent=L.desc}
  $('bidCount').textContent='—';$('resultLine').textContent='等待开拍';$('roundBids').innerHTML='';$('hammer').disabled=true;return;
 }
 const L=LOTS.find(x=>x.id===Number(roomData.current_lot));
 if(L){$('lotSelect').value=L.id;$('lotTitle').textContent=L.title;$('lotDesc').textContent=L.desc}
 else{$('lotTitle').textContent='等待选择对象';$('lotDesc').textContent=''}
 if(roomData.status==='open'){
   $('bidCount').textContent=bidCount+' 人已报价';
   $('resultLine').textContent='报价彼此不可见 · 主持人也只看到人数';
   $('roundBids').innerHTML='';
   $('hammer').disabled=bidCount<1;
 }else if(roomData.status==='closed' && roomData.current_lot){
   $('bidCount').textContent=bidCount+' 份报价';
   const currentWin=wins.find(w=>Number(w.lot_id)===Number(roomData.current_lot));
   $('resultLine').textContent=currentWin ? `成交：${currentWin.player_name} · 支付 ${fmtWan(currentWin.price)}` : '本轮已结束';
   $('hammer').disabled=true;
   $('roundBids').innerHTML=roundBids.length
     ? '<div style="font-weight:900;margin-bottom:6px">本轮报价（揭晓后公开）</div>'+roundBids.map((b,i)=>`<div class="owned"><b>${i+1}. ${b.player_name}</b> · 报价 ${fmtWan(b.amount)}${i===0?' · 最高价':''}${i===roundBids.length-1?' · 最低价':''}</div>`).join('')
     : '';
 }else{
   $('bidCount').textContent='—';$('resultLine').textContent='等待开拍';$('roundBids').innerHTML='';$('hammer').disabled=true;
 }
}
function renderPlayers(){$('playerCount').textContent=players.length;$('players').innerHTML=players.length?players.map(p=>`<div class="player"><b>${p.name}</b><span>${fmt(p.balance)}</span></div>`).join(''):'<div class="small">等待玩家加入</div>'}
function renderWins(){$('wins').innerHTML=wins.length?wins.map(w=>{const L=LOTS.find(x=>x.id===Number(w.lot_id));return `<div class="owned"><b>${L?L.title:'LOT '+w.lot_id}</b> → ${w.player_name} · 成交价 ${fmtWan(w.price)}${w.top_bid?`（最高报价 ${fmtWan(w.top_bid)}）`:''}</div>`}).join(''):'暂无'}
async function refresh(){
 if(!sb||!roomId||!hostSecret)return;
 const gen=syncGeneration,rid=roomId,secret=hostSecret;
 try{
  const {data,error}=await sb.rpc('love_get_host_state',{p_room_id:rid,p_host_secret:secret});
  if(gen!==syncGeneration||rid!==roomId||secret!==hostSecret)return;
  if(error)throw error;if(!data||!data.room)throw new Error('没有读到房间状态');
  roomData=data.room;players=Array.isArray(data.players)?data.players:[];wins=Array.isArray(data.wins)?data.wins:[];
  roundBids=Array.isArray(data.round_bids)?data.round_bids:[];bidCount=Number(data.bid_count||0);
  renderRoom();renderPlayers();renderWins();
  if(($('hostMsg').textContent||'').startsWith('同步失败'))$('hostMsg').textContent='';
 }catch(e){if(gen===syncGeneration&&rid===roomId){console.error('refresh failed',e);$('hostMsg').textContent='同步失败：'+e.message}}
}
function startSync(){
 stopSync(); const gen=syncGeneration,rid=roomId;
 pollTimer=setInterval(()=>{if(gen===syncGeneration&&rid===roomId)refresh()},1000);
 channel=sb.channel('love-host-'+rid+'-'+Date.now())
  .on('postgres_changes',{event:'*',schema:'public',table:'love_rooms',filter:'id=eq.'+rid},refresh)
  .on('postgres_changes',{event:'*',schema:'public',table:'love_players',filter:'room_id=eq.'+rid},refresh)
  .on('postgres_changes',{event:'*',schema:'public',table:'love_wins',filter:'room_id=eq.'+rid},refresh)
  .on('postgres_changes',{event:'*',schema:'public',table:'love_bids',filter:'room_id=eq.'+rid},refresh)
  .subscribe();
}
function showRoom(){
 clearRoomState();$('setup').classList.add('hidden');$('main').classList.remove('hidden');$('roomCode').textContent=roomId;
 const u=new URL('love-play.html',location.href);u.searchParams.set('room',roomId);u.searchParams.set('v','sealed-second-price-v1');$('joinUrl').textContent=u.href;
 $('qr').innerHTML='';new QRCode($('qr'),{text:u.href,width:160,height:160});startSync();refresh();
}
async function create(){try{stopSync();clearRoomState();sb=makeClient();roomId=($('roomInput').value.trim()||randCode()).toUpperCase();hostSecret=randToken();const {error}=await sb.rpc('love_create_room',{p_room_id:roomId,p_host_secret:hostSecret});if(error)throw error;localStorage.setItem('love_auction_host_'+roomId,hostSecret);$('setupMsg').textContent='';showRoom()}catch(e){roomId=null;hostSecret=null;$('setupMsg').textContent='创建失败：'+e.message}}
async function enterOld(){try{stopSync();clearRoomState();sb=makeClient();const code=$('roomInput').value.trim().toUpperCase();if(!code)throw new Error('请输入以前的房间码');const secret=localStorage.getItem('love_auction_host_'+code);if(!secret)throw new Error('这台浏览器没有保存这个房间的主持人权限。');const {data,error}=await sb.rpc('love_get_host_state',{p_room_id:code,p_host_secret:secret});if(error)throw error;if(!data||!data.room)throw new Error('房间不存在或主持人权限无效');roomId=code;hostSecret=secret;$('setupMsg').textContent='';showRoom()}catch(e){roomId=null;hostSecret=null;$('setupMsg').textContent='进入失败：'+e.message}}
function leaveRoom(){const old=roomId||'';stopSync();roomId=null;hostSecret=null;clearRoomState();$('main').classList.add('hidden');$('setup').classList.remove('hidden');$('roomInput').value='';$('setupMsg').textContent=old?'已退出房间 '+old+'。请输入房间码返回旧房间，或留空创建新房间。':'请选择房间。'}
function previewSelectedLot(){browsingLot=true;const L=currentLot();if(!L)return;$('lotTitle').textContent=L.title;$('lotDesc').textContent=L.desc;$('bidCount').textContent='—';$('resultLine').textContent='等待开拍';$('roundBids').innerHTML='';$('hammer').disabled=true}
$('createBtn').onclick=create;$('enterBtn').onclick=enterOld;$('leaveBtn').onclick=leaveRoom;
async function startLot(lotId,msg='已开拍'){
 try{const {error}=await sb.rpc('love_start_lot',{p_room_id:roomId,p_host_secret:hostSecret,p_lot_id:Number(lotId)});if(error)throw error;browsingLot=false;roomData=Object.assign({},roomData||{},{current_lot:Number(lotId),status:'open'});bidCount=0;roundBids=[];$('lotSelect').value=Number(lotId);renderRoom();$('hostMsg').textContent=msg;await refresh()}catch(e){$('hostMsg').textContent='开拍失败：'+e.message}
}
$('startBtn').onclick=()=>startLot(Number($('lotSelect').value),'已开拍：匿名报价开始');
$('hammer').onclick=async()=>{try{const {data,error}=await sb.rpc('love_close_lot',{p_room_id:roomId,p_host_secret:hostSecret});if(error)throw error;$('hostMsg').textContent=data&&data.message?data.message:'已揭晓并成交';await refresh()}catch(e){$('hostMsg').textContent=e.message}};
$('pass').onclick=async()=>{try{const {error}=await sb.rpc('love_pass_lot',{p_room_id:roomId,p_host_secret:hostSecret});if(error)throw error;$('hostMsg').textContent='已流拍';await refresh()}catch(e){$('hostMsg').textContent=e.message}};
$('next').onclick=async()=>{let i=Number($('lotSelect').value)||0;const nextId=Math.min(30,i+1);if(nextId===i){$('hostMsg').textContent='已经是最后一位对象';return}$('lotSelect').value=nextId;await startLot(nextId,'已切换到下一位并开始匿名报价')};
$('lotSelect').onchange=()=>{previewSelectedLot();$('hostMsg').textContent='已选择新对象，点“放出这位对象”开始匿名报价'};
window.addEventListener('pageshow',()=>{if(!$('main').classList.contains('hidden'))return;stopSync();roomId=null;hostSecret=null;clearRoomState();$('roomInput').value=''});
if(!cfgOk())$('setupMsg').textContent='先配置 Supabase，然后再创建房间。';
</script></body></html>
